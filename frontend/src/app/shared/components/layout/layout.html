<nav class="navbar">
  <a class="brand" routerLink="/">Coral</a>
  <ul>
    <li><a routerLink="/">Inicio</a></li>
    @if (authService.isLoggedIn()) {
      <li><a routerLink="/products">Productos</a></li>
      <li><a routerLink="/categories">Categorías</a></li>
      <li><a routerLink="/favorites">Favoritos</a></li>
      <li><a routerLink="/profile">Perfil</a></li>
      <li><a class="logout" (click)="logout()">Cerrar sesión</a></li>
    } @else {
      <li><a routerLink="/login">Iniciar sesión</a></li>
      <li><a class="cta" routerLink="/register">Registrarse</a></li>
    }
  </ul>
</nav>

<ng-content></ng-content>

<footer class="site-footer">
  <p>&copy; 2026 Coral. Sillas de diseño, hechas para durar.</p>
</footer>
